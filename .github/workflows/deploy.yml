name: Build and push image to Amazon ECR

on:
  push:
    branches: ["test/upload-ec2"] # สั่งให้ทำงานเมื่อ push ขึ้น branch test/upload-ec2

jobs:
  deploy:
    runs-on: ubuntu-latest # ใช้เครื่อง Server ของ GitHub (Ubuntu) เป็นตัวรัน Pipeline
    steps:
      - name: Checkout code
        uses: actions/checkout@v3 # ดึงโค้ดจาก Repository ลงมาที่เครื่องรันงาน
      
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24' # ระบุเวอร์ชันให้ชัดเจน

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1 # ยืนยันตัวตนกับ AWS โดยใช้ Keys ที่เก็บใน Secrets
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1 # ล็อกอินเข้า ECR เพื่อเตรียมสิทธิ์ในการ Push/Pull Image

      # Secret Scanning (Gitleaks Tool)
      # ตรวจสอบสิ่งที่ไม่ควรอยู่ในโค้ด
      - name: Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SCA (Govulncheck Tool)
      # ตรวจช่องโหว่ใน Go Library ที่ใช้งาน
      - name: Run Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd backend && $(go env GOPATH)/bin/govulncheck ./...

      # SAST (GoSec Tool) 
      # ตรวจ Source Code Security
      - name: Run Gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          cd backend && $(go env GOPATH)/bin/gosec ./...

      # Build Docker ก่อนเข้า Trivy
      - name: Build Docker Image
        run: |
          cd backend
          docker build -t pos-backend:test .

      # Container Scanning (Trivy Tool)
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "pos-backend:test"
          format: "table"
          exit-code: "1" # ถ้าเจอช่องโหว่ร้ายแรง (High/Critical) ให้หยุด Pipeline ทันที
          severity: "CRITICAL,HIGH"

      # ขั้นตอนการส่งของขึ้นหิ้ง (ECR): ทำเฉพาะเมื่อด่านตรวจด้านบนผ่านหมดแล้ว
      - name: Build and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: pos-backend # ชื่อที่ตั้งใน ECR
          IMAGE_TAG: latest
        run: |
          cd backend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG . # Build Image ตัวจริงที่จะใช้บน Production
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG # ส่ง Image ไปเก็บที่ AWS ECR

      # ขั้นตอนการสั่งงานเครื่องปลายทาง (EC2): นำ Image ใหม่ไปรันจริง
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master # รีโมทเข้าไปที่เครื่อง EC2 ผ่าน SSH
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Login ECR เพื่อให้ EC2 มีสิทธิ์ดึง Image
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

            # 2. หยุดและลบ Container เก่า (ถ้ามี)
            docker rm -f my-api || true

            # 3. ดึง Image ตัวล่าสุดลงมา
            docker pull ${{ steps.login-ecr.outputs.registry }}/pos-backend:latest

            # 4. รัน Container ใหม่ด้วย Image ล่าสุด
            docker run -d --name my-api -e POS_TERMINAL_SECRET=${{ secrets.POS_TERMINAL_SECRET }} --network="host" ${{ steps.login-ecr.outputs.registry }}/pos-backend:latest
