name: Build and push image to Amazon ECR

on:
  push:
    branches: [ "test/upload-ec2" ] # สั่งให้ทำงานเมื่อ push ขึ้น branch test/upload-ec2

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: pos-backend # ชื่อที่ตั้งใน ECR
          IMAGE_TAG: latest
        run: |
          cd backend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Login ECR เพื่อให้ EC2 มีสิทธิ์ดึง Image
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            
            # 2. หยุดและลบ Container เก่า (ถ้ามี)
            docker rm -f my-api || true
            
            # 3. ดึง Image ตัวล่าสุดลงมา
            docker pull ${{ steps.login-ecr.outputs.registry }}/pos-backend:latest
            
            # 4. รัน Container ใหม่ด้วย Image ล่าสุด
            docker run -d --name my-api --network="host" ${{ steps.login-ecr.outputs.registry }}/pos-backend:latest